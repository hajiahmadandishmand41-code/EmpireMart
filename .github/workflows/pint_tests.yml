name: Pint Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pint_tests:
    runs-on: ${{ matrix.operating-systems }}

    strategy:
      matrix:
        operating-systems: [ubuntu-latest]
        php-versions: ['8.3']

    name: PHP ${{ matrix.php-versions }} test on ${{ matrix.operating-systems }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pint
        run: composer global require laravel/pint
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer

      - name: Run Pint
        run: |
          set +e

          ${{ runner.temp }}/composer/vendor/bin/pint --test --format=github 2>&1 | tee /tmp/pint.log

          status=${PIPESTATUS[0]}

          if [ $status -ne 0 ]; then
            # The job log is not reachable from the outside, so the report is repeated as
            # annotations, which are: the files Pint would rewrite, then the summary.
            grep -E '\.php' /tmp/pint.log | head -40 | while IFS= read -r line; do
              echo "::error title=Pint::${line}"
            done

            tail -12 /tmp/pint.log | while IFS= read -r line; do
              echo "::error title=Pint summary::${line}"
            done
          fi

          exit $status
