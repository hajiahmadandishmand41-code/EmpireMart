name: Vercel PHP Preview Runtime Workaround

on:
  push:
    branches:
      - arena/c267531a-empiremart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-php-preview-runtime-workaround
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build, patch, and smoke-test Preview only
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_3pkyehEtf69z1OVyJ6rhc7Qy
      VERCEL_PROJECT_ID: prj_BXRzadJQYpww7EfDZqbMUDumKyNn

    steps:
      - name: Check out the reviewed branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Verify Vercel token is configured without printing it
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN. Add a scoped Vercel token to the repository Actions secrets; never put it in code or chat."
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.7.0

      - name: Pull Preview configuration
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output
        run: vercel build

      - name: Patch Vercel PHP launcher output
        run: node scripts/patch-vercel-php-output.mjs

      - name: Verify the patched function output
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = '.vercel/output/functions';
          const found = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const item = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(item);
              else if (entry.name === '.vc-config.json') {
                const config = JSON.parse(fs.readFileSync(item, 'utf8'));
                if (config.awsLambdaHandler === 'launcher.launcher') found.push({ item, config });
              }
            }
          }
          walk(root);
          if (found.length !== 1) throw new Error(`Expected one patched PHP function; found ${found.length}`);
          const { item, config } = found[0];
          const dir = path.dirname(item);
          if (config.handler !== 'launcher.js' || config.launcherType !== 'Nodejs' || config.awsLambdaHandler !== 'launcher.launcher') throw new Error('Vercel PHP launcher configuration is not patched');
          for (const file of ['launcher.js', 'launcher-orig.js', 'helpers.js']) {
            if (!fs.existsSync(path.join(dir, file))) throw new Error(`Missing required runtime bridge file: ${file}`);
          }
          console.log('Verified patched PHP function output and launcher bridge files.');
          NODE

      - name: Deploy patched build to Preview only and test HTTP response
        shell: bash
        run: |
          set -euo pipefail
          # Vercel's prebuilt uploader conflicts with the repository ignore file.
          # The function's excludeFiles config explicitly excludes that file and .git metadata.
          rm -f .vercelignore
          vercel deploy --prebuilt --yes --target=preview --archive=tgz 2>&1 | tee /tmp/vercel-deploy.log

          DEPLOY_URL="$(grep -Eo 'https://[[:alnum:].-]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1 || true)"
          if [[ -z "$DEPLOY_URL" ]]; then
            echo "::error::Vercel did not return a Preview URL. See deployment output above."
            exit 1
          fi

          echo "Testing Preview URL: $DEPLOY_URL"
          HTTP_CODE="000"
          for attempt in 1 2 3 4 5; do
            HTTP_CODE="$(curl --silent --show-error --location --max-time 25 --output /tmp/preview-response.txt --write-out '%{http_code}' "$DEPLOY_URL/" || true)"
            if [[ "$HTTP_CODE" == "200" ]]; then
              break
            fi
            echo "Preview returned HTTP $HTTP_CODE on attempt $attempt."
            sleep 3
          done

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Preview smoke test failed: expected HTTP 200, received $HTTP_CODE."
            echo "Response preview (first 500 bytes):"
            head -c 500 /tmp/preview-response.txt || true
            exit 1
          fi

          if grep -Eq 'FUNCTION_INVOCATION_FAILED|Internal Server Error' /tmp/preview-response.txt; then
            echo "::error::Preview response contains a runtime failure marker."
            exit 1
          fi

          echo "Preview smoke test passed with HTTP 200. Production was not targeted."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
