name: Vercel PHP Build

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:
    inputs:
      update_s3_lock:
        description: Resolve the approved S3 filesystem adapter and commit its lockfile.
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve_s3_dependency:
    if: github.event_name == 'workflow_dispatch' && inputs.update_s3_lock == true && github.ref_name == 'arena/c267531a-empiremart'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the fixed Arena branch
        uses: actions/checkout@v4
        with:
          ref: arena/c267531a-empiremart

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          tools: composer:v2

      - name: Resolve the approved S3 adapter and lockfile
        run: composer require league/flysystem-aws-s3-v3:^3.25.1 --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Commit only the Composer manifests to the fixed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Composer manifests already contain the approved adapter.'
            exit 0
          fi
          git commit -m 'build: add S3 filesystem adapter'
          git push origin HEAD:arena/c267531a-empiremart

  vercel_php_build:
    if: github.event_name != 'workflow_dispatch' || inputs.update_s3_lock != true
    runs-on: ubuntu-latest

    name: PHP 8.4 function and static assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Check Vercel entrypoint syntax
        run: php -l api/index.php

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Run the Vercel Composer setup script
        run: composer run vercel

      - name: Validate Vercel project configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('vercel.json').read_text())
          exclusions = config['functions']['api/index.php']['excludeFiles']
          assert isinstance(exclusions, str), 'Vercel excludeFiles must be a glob string'
          for pattern in ('.env', '.env.*', 'node_modules/**', 'public/fonts/**'):
              assert pattern in exclusions, f'Missing function exclusion: {pattern}'
          PY

      - name: Install root Node.js dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --no-audit --no-fund

      - name: Build Vercel static output
        run: npm run vercel:build

      - name: Verify static output is safe and complete
        run: |
          test -f dist/build/manifest.json
          test -f dist/themes/shop/default/build/manifest.json
          test -f dist/themes/admin/default/build/manifest.json
          if find dist -type f \( -name '*.php' -o -name '.htaccess' \) -print -quit | grep -q .; then
            echo 'Server-side files must not be published as static output.'
            exit 1
          fi
